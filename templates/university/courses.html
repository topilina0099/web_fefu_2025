{% extends "university/base.html" %}

{% block title %}Список курсов{% endblock %}
{% block heading %}Список курсов{% endblock %}

{% block content %}
<ul>
    {% for slug, course in courses.items %}
        <li>
            <a href="{% url 'course' course_slug=slug %}">{{ course.name }}</a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
